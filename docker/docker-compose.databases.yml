# =============================================================================
# FlowCore — Databases + Kafka Only
# 
# Starts ONLY the persistent stores and message bus:
#   - PostgreSQL (Layer 2 Source Normalisation + Layer 4 Agent Outputs)
#   - TimescaleDB (Layer 3 Telemetry & Live State)
#   - Neo4j (Layer 1 Canonical Physical Registry)
#   - Redpanda/Kafka (Message bus)
#   - Kafka UI (Redpanda Console)
#
# Does NOT start any application services (platform, api-ui, agents).
# Use this for local development where you run services natively or in IDE.
#
# Usage:
#   docker compose -f docker/docker-compose.databases.yml up -d
#   docker compose -f docker/docker-compose.databases.yml down
#
# Or via scripts:
#   ./scripts/start-databases.sh    (Linux/Mac)
#   .\scripts\start-databases.bat   (Windows)
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL 15 — Layer 2 (Source Normalisation) + Layer 4 (Agent Outputs)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: flowcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       flowcore
      POSTGRES_USER:     flowcore
      POSTGRES_PASSWORD: flowcore_secret
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcore -d flowcore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowcore-net

  # ===========================================================================
  # TimescaleDB 2.x on PostgreSQL 15 — Layer 3 (Telemetry & Live State)
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: flowcore-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB:       flowcore_ts
      POSTGRES_USER:     flowcore
      POSTGRES_PASSWORD: flowcore_secret
      PGDATA:            /var/lib/postgresql/data/pgdata
      TIMESCALEDB_TELEMETRY: "off"
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c timescaledb.telemetry_level=off
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcore -d flowcore_ts"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowcore-net

  # ===========================================================================
  # Neo4j 5 Community — Layer 1 (Canonical Physical Registry / Knowledge Graph)
  # ===========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: flowcore-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH:                          neo4j/flowcore_secret
      NEO4J_PLUGINS:                       '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size:    1G
      NEO4J_dbms_memory_pagecache_size:    512m
      NEO4J_server_default__listen__address: 0.0.0.0
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - flowcore-net

  # ===========================================================================
  # Redpanda (Kafka-compatible) — Message Bus
  # ===========================================================================
  kafka:
    image: redpandadata/redpanda:latest
    container_name: flowcore-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --schema-registry-addr http://0.0.0.0:8081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
    ports:
      - "9092:9092"      # internal Kafka (services use this)
      - "19092:19092"    # external Kafka (host tools)
      - "8090:8080"      # Redpanda Console (Kafka UI)
      - "9644:9644"      # Redpanda admin API
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - flowcore-net

  # ===========================================================================
  # Kafka Topic Initialisation — one-shot container
  # ===========================================================================
  kafka-init:
    image: redpandadata/redpanda:latest
    container_name: flowcore-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating FlowCore Kafka topics..."
        for topic in \
          dcim.config.raw \
          dcim.config.normalized \
          metrics.timeseries.raw \
          alerts.raw \
          events.raw \
          discovery.snmp.results \
          discovery.bmc.results \
          graph.mutations \
          drift.events \
          drift.suggestions \
          classification.results \
          incidents.correlated; do
          rpk topic create $$topic \
            --brokers kafka:9092 \
            --partitions 3 \
            --replicas 1 \
            --topic-config retention.ms=604800000 \
            --topic-config cleanup.policy=delete \
            2>&1 || echo "Topic $$topic may already exist — continuing"
        done
        echo "All topics created."
    networks:
      - flowcore-net

  # ===========================================================================
  # Redpanda Console — Web UI for Kafka
  # ===========================================================================
  kafka-ui:
    image: redpandadata/console:latest
    container_name: flowcore-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://kafka:9644"]
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - flowcore-net

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  postgres_data:
  timescale_data:
  neo4j_data:
  neo4j_logs:
  kafka_data:

# =============================================================================
# Internal network
# =============================================================================
networks:
  flowcore-net:
    driver: bridge
