version: "3.9"
# =============================================================================
# FlowCore — SigNoz Observability Stack
#
# Adds OpenTelemetry-native observability (traces, logs, metrics) to FlowCore.
# SigNoz UI: http://localhost:8081 (mapped from container port 8080)
# OTLP Endpoint: http://signoz-otel-collector:4317 (gRPC) / 4318 (HTTP)
#
# Services:
#   - clickhouse:    Columnar DB for telemetry storage (:9000/:8123 internal)
#   - zookeeper-1:   ClickHouse coordination (:2181 internal)
#   - signoz:        Query service + UI (:8080 → host :8081)
#   - otel-collector: OTLP receiver + processor (:4317/:4318)
#
# Integration:
#   Set OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
#   in services that should send telemetry.
#
# Usage:
#   docker compose -f docker/docker-compose.signoz.yml up -d
# =============================================================================

x-common: &common
  networks:
    - flowcore-net
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

x-clickhouse-defaults: &clickhouse-defaults
  <<: *common
  image: clickhouse/clickhouse-server:25.5.6-alpine
  tty: true
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9363"
    signoz.io/path: "/metrics"
  depends_on:
    signoz-init-clickhouse:
      condition: service_completed_successfully
    signoz-zookeeper-1:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - wget
      - --spider
      - -q
      - 0.0.0.0:8123/ping
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1

x-zookeeper-defaults: &zookeeper-defaults
  <<: *common
  image: signoz/zookeeper:3.7.1
  user: root
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"
  healthcheck:
    test:
      - CMD-SHELL
      - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
    interval: 30s
    timeout: 5s
    retries: 3

x-db-depend: &db-depend
  <<: *common
  depends_on:
    signoz-clickhouse:
      condition: service_healthy

services:
  signoz-init-clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:25.5.6-alpine
    container_name: flowcore-signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -q -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        chmod +x /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - signoz_clickhouse_scripts:/var/lib/clickhouse/user_scripts/

  signoz-zookeeper-1:
    <<: *zookeeper-defaults
    container_name: flowcore-signoz-zookeeper-1
    volumes:
      - signoz_zookeeper_1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141

  signoz-clickhouse:
    <<: *clickhouse-defaults
    container_name: flowcore-signoz-clickhouse
    volumes:
      - ./signoz/clickhouse-config.xml:/etc/clickhouse-server/config.d/flowcore-config.xml:ro
      - ./signoz/clickhouse-users.xml:/etc/clickhouse-server/users.d/flowcore-users.xml:ro
      - ./signoz/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - signoz_clickhouse_data:/var/lib/clickhouse/
      - signoz_clickhouse_scripts:/var/lib/clickhouse/user_scripts/

  signoz:
    <<: *db-depend
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.118.0}
    container_name: flowcore-signoz
    ports:
      # Map container 8080 to host 8081 to avoid conflict with Keycloak
      - "${SIGNOZ_UI_PORT:-8081}:8080"
    volumes:
      - signoz_sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:-flowcore_signoz_secret}
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-otel-collector:
    <<: *db-depend
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_VERSION:-v0.144.2}
    container_name: flowcore-signoz-otel-collector
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=flowcore-signoz,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
    ports:
      # OTLP receivers - these are the endpoints FlowCore services use
      - "${SIGNOZ_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC receiver
      - "${SIGNOZ_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP receiver
    # Expose to other FlowCore services
    expose:
      - "4317"
      - "4318"

  signoz-telemetrystore-migrator:
    <<: *db-depend
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_VERSION:-v0.144.2}
    container_name: flowcore-signoz-telemetrystore-migrator
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure

networks:
  flowcore-net:
    external: true
    name: flowcore_flowcore-net

volumes:
  signoz_clickhouse_data:
    name: flowcore-signoz-clickhouse
  signoz_clickhouse_scripts:
    name: flowcore-signoz-clickhouse-scripts
  signoz_sqlite:
    name: flowcore-signoz-sqlite
  signoz_zookeeper_1:
    name: flowcore-signoz-zookeeper-1
